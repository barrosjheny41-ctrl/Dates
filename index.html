<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passaporte do Casal - Date Quest</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Playfair+Display:ital,wght@0,600;1,700&family=Poppins:wght@400;600;800&display=swap');

        :root {
            --bg-ocean: #091322;
            --primary-blue: #0A146E;
            --accent-gold: #f3c649;
            --paper-cream: #fbf8f3;
            --paper-border: #d4c5b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-ocean); color: #fff; overflow-x: hidden; min-height: 100vh; }

        /* LOBBY DE ENTRADA */
        #lobby {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; background: radial-gradient(circle at center, #1a2a4a 0%, #080d1a 100%);
            color: white; text-align: center; padding: 20px; position: fixed; width: 100%; top: 0; left: 0; z-index: 2000;
        }
        .lobby-box { background: rgba(255,255,255,0.08); padding: 30px; border-radius: 24px; backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.15); max-width: 420px; width: 100%; }
        .lobby-box h1 { font-family: 'Cinzel', serif; font-size: 2.2rem; color: var(--accent-gold); margin-bottom: 6px; }
        .lobby-box input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: none; font-size: 16px; text-align: center; text-transform: uppercase; font-weight: bold; }
        .lobby-box button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
        .btn-gold { background: linear-gradient(90deg, #f3c649, #e0a926); color: #000; }
        .btn-blue { background: #3a86ff; color: white; }
        #display-codigo { font-size: 28px; font-weight: 800; letter-spacing: 6px; margin: 15px 0; color: var(--accent-gold); background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; border: 1px dashed var(--accent-gold); }

        .avatar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .avatar-card { background: rgba(255,255,255,0.08); border-radius: 14px; padding: 10px; cursor: pointer; border: 2px solid transparent; }
        .avatar-card.selected { border-color: var(--accent-gold); background: rgba(243, 198, 73, 0.25); }

        /* APP PRINCIPAL */
        #app { display: none; padding: 20px 10px 80px; max-width: 600px; margin: 0 auto; }

        /* ALTERNADOR DE USUÁRIO */
        .user-switcher {
            display: flex; justify-content: center; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.08); padding: 10px 16px; border-radius: 50px;
            margin: 0 auto 20px; max-width: 360px; border: 1px solid rgba(255,255,255,0.15);
        }
        .user-badge {
            display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px;
            cursor: pointer; opacity: 0.5; transition: 0.3s; font-size: 13px; font-weight: 600;
        }
        .user-badge.active { opacity: 1; background: var(--accent-gold); color: #000; box-shadow: 0 4px 12px rgba(243,198,73,0.4); }

        /* LIVRO PASSAPORTE (SEM ESPELHAMENTO) */
        .passport-container { display: flex; justify-content: center; position: relative; margin-top: 10px; }
        
        .book-wrapper {
            width: 340px; height: 500px; position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); border-radius: 16px; overflow: hidden;
            background: var(--paper-cream); border: 2px solid var(--paper-border);
        }

        /* Capa do Passaporte (Abre Deslizando para a Esquerda) */
        .book-cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: linear-gradient(135deg, #0f1b38, #050a17); border-right: 2px solid var(--accent-gold);
            border-left: 8px solid rgba(0,0,0,0.4); border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 40px 20px; transition: transform 0.6s ease-in-out, opacity 0.4s;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5); cursor: pointer;
        }
        .book-cover.opened { transform: translateX(-105%); opacity: 0; pointer-events: none; }

        .cover-emblem { font-size: 60px; color: var(--accent-gold); }
        .cover-title { font-family: 'Cinzel', serif; font-size: 22px; color: var(--accent-gold); letter-spacing: 4px; font-weight: 800; text-align: center; }
        .cover-name { font-family: 'Playfair Display', serif; font-size: 22px; color: #fff; border-bottom: 2px solid var(--accent-gold); padding-bottom: 6px; width: 85%; text-align: center; }
        .cover-hint { font-size: 11px; color: var(--accent-gold); letter-spacing: 2px; font-weight: bold; }

        /* Página Interna do Livro */
        .book-page {
            width: 100%; height: 100%; padding: 20px; color: #222;
            display: flex; flex-direction: column; justify-content: space-between;
            background: var(--paper-cream);
        }

        .page-header { text-align: center; border-bottom: 2px dashed #b5a48b; padding-bottom: 12px; }
        .page-avatar { font-size: 40px; background: #fff; width: 65px; height: 65px; line-height: 65px; border-radius: 50%; margin: 0 auto 6px; border: 2px solid var(--accent-gold); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .page-owner { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: bold; color: var(--primary-blue); }
        
        .page-stats { background: #e8ded0; padding: 10px; border-radius: 10px; font-size: 11px; margin: 10px 0; }
        .stats-row { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; color: var(--primary-blue); }
        .bar-bg { height: 8px; background: #ccc; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary-blue); width: 0%; transition: width 0.4s; }

        /* Grade de Carimbos (Sem Inversão de Texto) */
        .stamps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex-grow: 1; align-content: start; margin-top: 8px; }
        .stamp-box {
            aspect-ratio: 1; border-radius: 50%; border: 2px dashed #a0907a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 4px; opacity: 0.4; background: rgba(255,255,255,0.5);
        }
        .stamp-box.stamped {
            opacity: 1; border: 3px double #0b1a48; color: #0b1a48; transform: rotate(-8deg); background: #f0f3ff;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }
        .stamp-box h6 { font-size: 8px; font-weight: 800; text-transform: uppercase; margin-top: 2px; }

        /* Controles de Página de Livro */
        .page-navigation { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #d4c5b0; padding-top: 10px; }
        .btn-nav-page { background: var(--primary-blue); color: #fff; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .btn-nav-page:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-indicator { font-size: 11px; font-weight: bold; color: #666; }

        .btn-fechar-capa { background: transparent; border: 1px solid #b5a48b; color: #555; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 10px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- LOBBY -->
    <div id="lobby">
        <div class="lobby-box">
            <h1>Date Quest</h1>
            <p>Seu Passaporte Oficial de Encontros</p>

            <div id="step-codigo">
                <button id="btn-gerar" class="btn-gold">Gerar Código do Casal</button>
                <div id="display-codigo"></div>
                <hr style="border-color: rgba(255,255,255,0.15); margin: 15px 0;">
                <p style="font-size: 12px; margin-bottom: 8px;">Ou insira o código da sua parceira:</p>
                <input type="text" id="input-codigo" placeholder="EX: A4X9" maxlength="4">
                <button id="btn-conectar" class="btn-blue">Conectar Passaportes</button>
            </div>

            <div id="step-perfil" style="display:none;">
                <h3 style="color: var(--accent-gold); margin-bottom: 8px;">Configurar Seu Perfil</h3>
                <p style="font-size: 12px;">Escolha quem você é na dupla:</p>
                
                <div style="display: flex; gap: 10px; margin: 15px 0;">
                    <button id="btn-p1" class="btn-blue" style="margin:0;" onclick="selecionarSlot('p1')">Pessoa 1</button>
                    <button id="btn-p2" class="btn-blue" style="margin:0; background:#8338ec;" onclick="selecionarSlot('p2')">Pessoa 2</button>
                </div>

                <input type="text" id="input-nome" placeholder="Seu Nome no Passaporte" style="margin-bottom: 15px;">

                <p style="font-size: 12px;">Escolha seu Avatar:</p>
                <div class="avatar-grid">
                    <div class="avatar-card selected" onclick="escolherAvatar('👑', this)"><span>👑</span></div>
                    <div class="avatar-card" onclick="escolherAvatar('🐱', this)"><span>🐱</span></div>
                    <div class="avatar-card" onclick="escolherAvatar('🦊', this)"><span>🦊</span></div>
                    <div class="avatar-card" onclick="escolherAvatar('🌸', this)"><span>🌸</span></div>
                    <div class="avatar-card" onclick="escolherAvatar('🍷', this)"><span>🍷</span></div>
                    <div class="avatar-card" onclick="escolherAvatar('✨', this)"><span>✨</span></div>
                </div>

                <button class="btn-gold" onclick="salvarPerfilCompleto()">Abrir Passaporte</button>
            </div>
        </div>
    </div>

    <!-- APP PRINCIPAL (ABA DO PASSAPORTE) -->
    <div id="app">
        <!-- Alternador de Usuários no Topo -->
        <div class="user-switcher">
            <div class="user-badge active" id="badge-p1" onclick="mudarPerfilExibido('p1')">
                <span id="switcher-avatar-p1">👑</span> <span id="switcher-nome-p1">Pessoa 1</span>
            </div>
            <div class="user-badge" id="badge-p2" onclick="mudarPerfilExibido('p2')">
                <span id="switcher-avatar-p2">🐱</span> <span id="switcher-nome-p2">Pessoa 2</span>
            </div>
        </div>

        <!-- Estrutura do Passaporte em Livro -->
        <div class="passport-container">
            <div class="book-wrapper">
                
                <!-- Capa Frontal -->
                <div class="book-cover" id="book-cover" onclick="abrirCapa()">
                    <div class="cover-emblem">🌐</div>
                    <div class="cover-title">PASSAPORTE</div>
                    <div class="cover-name" id="cover-active-name">Pessoa 1</div>
                    <div class="cover-hint">CLIQUE PARA ABRIR ➔</div>
                </div>

                <!-- Interior / Páginas -->
                <div class="book-page">
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <button class="btn-fechar-capa" onclick="fecharCapa()">⬅ Capa</button>
                            <span style="font-size: 10px; color: #888; font-weight: bold;">DOCUMENTO OFICIAL</span>
                        </div>

                        <div class="page-header">
                            <div class="page-avatar" id="page-active-avatar">👑</div>
                            <div class="page-owner" id="page-active-name">Pessoa 1</div>
                        </div>

                        <div class="page-stats">
                            <div class="stats-row"><span id="active-nivel">Nível 1</span><span id="active-xp">0 XP</span></div>
                            <div class="bar-bg"><div class="bar-fill" id="active-fill"></div></div>
                        </div>
                    </div>

                    <!-- Grade dos 22 Restaurantes (6 Por Folha) -->
                    <div class="stamps-grid" id="stamps-container"></div>

                    <!-- Navegação de Páginas -->
                    <div class="page-navigation">
                        <button class="btn-nav-page" id="btn-prev-page" onclick="paginaAnterior()">◀ Anterior</button>
                        <span class="page-indicator">PÁG. <span id="pag-num">1</span> DE 4</span>
                        <button class="btn-nav-page" id="btn-next-page" onclick="proximaPagina()">Próxima ▶</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- FIREBASE SDK & LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
  apiKey: "AIzaSyBKeGPY0nBPpV_uo6N-vGuK-zNbmLP14wE",
  authDomain: "date-quest-sp.firebaseapp.com",
  projectId: "date-quest-sp",
  storageBucket: "date-quest-sp.firebasestorage.app",
  messagingSenderId: "813648855167",
  appId: "1:813648855167:web:122ba98df663347620ff4a",
  measurementId: "G-PMH0W7QCLC"

};
   

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Lista Exata dos 22 Restaurantes
        const restaurantes = [
            { id: "r1", nome: "Madero" }, { id: "r2", nome: "Outback" }, { id: "r3", nome: "Bacio di Latte" },
            { id: "r4", nome: "Z Deli" }, { id: "r5", nome: "Carlo's Bakery" }, { id: "r6", nome: "Le Bife" },
            { id: "r7", nome: "Eataly" }, { id: "r8", nome: "Patties" }, { id: "r9", nome: "Taverna Medieval" },
            { id: "r10", nome: "Beco Hexagonal" }, { id: "r11", nome: "Vassoura Quebrada" }, { id: "r12", nome: "Magia & Bruxaria" },
            { id: "r13", nome: "Hannover" }, { id: "r14", nome: "Chalezinho" }, { id: "r15", nome: "Famiglia Mancini" },
            { id: "r16", nome: "L'Entrecôte" }, { id: "r17", nome: "Paris 6" }, { id: "r18", nome: "Figueira Rubaiyat" },
            { id: "r19", nome: "Skye Bar" }, { id: "r20", nome: "Maní" }, { id: "r21", nome: "D.O.M." }, { id: "r22", nome: "Terraço Itália" }
        ];

        let codigoAtual = null;
        let slotMeu = 'p1';
        let perfilExibido = 'p1';
        let avatarEscolha = '👑';
        let dadosCasal = null;
        let paginaAtual = 1;

        // LOBBY
        document.getElementById("btn-gerar").addEventListener("click", async () => {
            const btn = document.getElementById("btn-gerar");
            btn.innerText = "Conectando..."; btn.disabled = true;
            try {
                const codigo = Math.random().toString(36).substring(2, 6).toUpperCase();
                await signInAnonymously(auth);
                await setDoc(doc(db, "vinculos", codigo), {
                    p1: { nome: "Pessoa 1", avatar: "👑", xp: 0, concluidos: [] },
                    p2: { nome: "Pessoa 2", avatar: "🐱", xp: 0, concluidos: [] }
                });
                document.getElementById("display-codigo").innerText = codigo;
                codigoAtual = codigo;
                irParaPerfil();
            } catch(e) {
                alert("Verifique suas chaves do Firebase!");
                btn.innerText = "Gerar Código do Casal"; btn.disabled = false;
            }
        });

        document.getElementById("btn-conectar").addEventListener("click", async () => {
            const codigo = document.getElementById("input-codigo").value.toUpperCase();
            if(codigo.length === 4) {
                await signInAnonymously(auth);
                const docSnap = await getDoc(doc(db, "vinculos", codigo));
                if(docSnap.exists()) {
                    codigoAtual = codigo;
                    irParaPerfil();
                } else {
                    alert("Código não encontrado!");
                }
            }
        });

        function irParaPerfil() {
            document.getElementById("step-codigo").style.display = "none";
            document.getElementById("step-perfil").style.display = "block";
        }

        window.selecionarSlot = function(slot) {
            slotMeu = slot;
            perfilExibido = slot;
            document.getElementById("btn-p1").style.border = slot === 'p1' ? '2px solid #f3c649' : 'none';
            document.getElementById("btn-p2").style.border = slot === 'p2' ? '2px solid #f3c649' : 'none';
        }

        window.escolherAvatar = function(emoji, el) {
            avatarEscolha = emoji;
            document.querySelectorAll(".avatar-card").forEach(c => c.classList.remove("selected"));
            el.classList.add("selected");
        }

        window.salvarPerfilCompleto = async function() {
            const nome = document.getElementById("input-nome").value || (slotMeu === 'p1' ? 'Pessoa 1' : 'Pessoa 2');
            const ref = doc(db, "vinculos", codigoAtual);
            
            await updateDoc(ref, {
                [`${slotMeu}.nome`]: nome,
                [`${slotMeu}.avatar`]: avatarEscolha
            });

            iniciarApp();
        }

        function iniciarApp() {
            document.getElementById("lobby").style.display = "none";
            document.getElementById("app").style.display = "block";

            onSnapshot(doc(db, "vinculos", codigoAtual), (docSnap) => {
                if(docSnap.exists()) {
                    dadosCasal = docSnap.data();
                    renderizarInterface();
                }
            });
        }

        // CONTROLES DE CAPA E PÁGINA
        window.abrirCapa = function() {
            document.getElementById("book-cover").classList.add("opened");
        }

        window.fecharCapa = function() {
            document.getElementById("book-cover").classList.remove("opened");
        }

        window.mudarPerfilExibido = function(slot) {
            perfilExibido = slot;
            document.querySelectorAll(".user-badge").forEach(b => b.classList.remove("active"));
            document.getElementById(`badge-${slot}`).classList.add("active");
            paginaAtual = 1;
            renderizarPassaporte();
        }

        window.proximaPagina = function() {
            if(paginaAtual < 4) {
                paginaAtual++;
                renderizarPassaporte();
            }
        }

        window.paginaAnterior = function() {
            if(paginaAtual > 1) {
                paginaAtual--;
                renderizarPassaporte();
            }
        }

        function renderizarInterface() {
            document.getElementById("switcher-avatar-p1").innerText = dadosCasal.p1.avatar;
            document.getElementById("switcher-nome-p1").innerText = dadosCasal.p1.nome;
            document.getElementById("switcher-avatar-p2").innerText = dadosCasal.p2.avatar;
            document.getElementById("switcher-nome-p2").innerText = dadosCasal.p2.nome;

            renderizarPassaporte();
        }

        function renderizarPassaporte() {
            const data = dadosCasal[perfilExibido] || { nome: perfilExibido, avatar: '👑', xp: 0, concluidos: [] };

            document.getElementById("cover-active-name").innerText = data.nome;
            document.getElementById("page-active-name").innerText = data.nome;
            document.getElementById("page-active-avatar").innerText = data.avatar;

            let nivel = Math.floor(data.xp / 300) + 1;
            let xpRestante = data.xp % 300;
            document.getElementById("active-nivel").innerText = `Nível ${nivel}`;
            document.getElementById("active-xp").innerText = `${xpRestante} / 300 XP`;
            document.getElementById("active-fill").style.width = `${(xpRestante/300)*100}%`;

            // Páginas (6 Restaurantes por Folha)
            document.getElementById("pag-num").innerText = paginaAtual;
            document.getElementById("btn-prev-page").disabled = (paginaAtual === 1);
            document.getElementById("btn-next-page").disabled = (paginaAtual === 4);

            const container = document.getElementById("stamps-container");
            container.innerHTML = "";

            const inicio = (paginaAtual - 1) * 6;
            const fim = inicio + 6;

            restaurantes.slice(inicio, fim).forEach(r => {
                const carimbado = (data.concluidos || []).includes(r.id);
                container.innerHTML += `
                    <div class="stamp-box ${carimbado ? 'stamped' : ''}">
                        <span style="font-size: 16px;">${carimbado ? '📍' : '🔒'}</span>
                        <h6>${r.nome}</h6>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
